# Fonte única de versões (T-001).
# Nenhuma versão literal em build.gradle.kts — se aparecer, a revisão rejeita.
# Versões elevadas pelo Android Studio no primeiro sync (AGP 8.13 -> 9.0), e
# validadas por ele. Minha pesquisa original filtrou a linha 9.x por engano e
# fixou uma major atrasada.

[versions]
agp = "9.0.1"
kotlin = "2.2.10"
ksp = "2.3.2"                # KSP2: versionamento independente do Kotlin,
                             # diferente do KSP1, que usava <kotlin>-<ksp>
detekt = "1.23.8"

# --- em uso a partir da T-001 ---
#
# ATENÇÃO ao atualizar: as três versões abaixo estão DELIBERADAMENTE uma
# linha atrás da última. Compose BOM 2026.08.00, core-ktx 1.19.0 e
# lifecycle 2.11.0 exigem `compileSdk 37` e AGP 9.1+, e o build quebra com
# 28 erros de metadados de AAR. Subir só estas versões não funciona: exige
# também compileSdk 37, AGP >= 9.1 e a plataforma android-37 instalada.
composeBom = "2026.06.01"
coreKtx = "1.18.0"
activityCompose = "1.13.0"
lifecycle = "2.10.0"

# --- declarados aqui, aplicados nas suas próprias tasks ---
navigationCompose = "2.9.8"    # T-011 — terceira dependência a exigir
                             # compileSdk 37 na última linha (2.10.0). A 2.9.8
                             # declara minCompileSdk=35 e passa
serialization = "1.9.0"        # rotas type-safe do Navigation (T-011)
room = "2.8.4"                 # T-004
sqlcipher = "4.17.0"           # T-005 — uma linha atrás da última de
                             # propósito: a 4.18.0 declara minCompileSdk=37
                             # e reprova o build no checkAarMetadata, pelo
                             # mesmo motivo do bloco de Compose acima
hilt = "2.60.1"                # T-009
hiltNavigationCompose = "1.4.0"
datastore = "1.2.1"            # T-009
work = "2.11.2"                # T-031
biometric = "1.1.0"            # T-018
vico = "3.3.1"                 # T-033

junit = "4.13.2"
# Teste instrumentado: a única forma de exercer SQLCipher e Keystore, que não
# existem na JVM (T-005). Uma linha atrás da última, mesmo motivo dos demais.
androidxTestJunit = "1.2.1"
androidxTestRunner = "1.6.2"
turbine = "1.2.0"
# Room precisa de SQLite e de um Context. O Robolectric roda os dois na JVM,
# em segundos; a alternativa e emulador no CI, minutos por rodada (T-004).
robolectric = "4.16"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }

androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
sqlcipher-android = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipher" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
vico-compose-m3 = { module = "com.patrykandpatrick.vico:compose-m3", version.ref = "vico" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
