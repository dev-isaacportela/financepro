name: Release

# Dispara na tag, não no merge: publicar é decisão, não consequência de um push.
# `v0.1.0` precisa bater com o `versionName` do app — a primeira coisa que este
# workflow faz é conferir isso, porque uma tag que mente sobre a versão do APK
# só aparece depois, na mão de quem instalou.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # criar a release e anexar o APK

jobs:
  release:
    name: APK assinado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: A tag bate com o versionName
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "$tag" != "$app" ]; then
            echo "::error::tag $GITHUB_REF_NAME e versionName $app não batem"
            exit 1
          fi
          echo "versão $app"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # As mesmas guardas do CI. A tag não passa pelo workflow de push em `main`,
      # e publicar sem elas é publicar sem revisão.
      - name: trace.py
        run: python tools/trace.py --phase F0

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: detekt
        run: ./gradlew detekt --no-configuration-cache

      - name: Testes de unidade
        run: ./gradlew test

      # O keystore vive nos secrets e existe apenas dentro deste job. Falha aqui
      # se o secret não estiver configurado: um APK não assinado é ininstalável,
      # e descobrir isso depois de publicar é pior que não publicar.
      - name: Keystore
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::secret RELEASE_KEYSTORE_BASE64 não configurado"
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > release.jks
          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: assembleRelease
        run: ./gradlew assembleRelease

      - name: Apagar o keystore
        if: always()
        run: rm -f release.jks keystore.properties

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="financepro-${GITHUB_REF_NAME}.apk"
          mv app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"

          # A seção da versão no CHANGELOG vira o corpo da release. Sem `awk` de
          # verdade: da linha `## [x.y.z]` até o próximo `##`, exclusive.
          awk -v cabecalho="## [${GITHUB_REF_NAME#v}]" \
            'index($0, cabecalho) == 1 { f = 1; next } f && /^## / { exit } f' \
            CHANGELOG.md > notas.md
          if [ ! -s notas.md ]; then
            echo "::error::CHANGELOG.md não tem seção para ${GITHUB_REF_NAME#v}"
            exit 1
          fi

          gh release create "$GITHUB_REF_NAME" "$apk" "$apk.sha256" \
            --title "$GITHUB_REF_NAME" --notes-file notas.md
