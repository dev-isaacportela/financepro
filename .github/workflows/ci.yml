name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate de especificação. Roda primeiro e sem Gradle: se a rastreabilidade
  # quebrou, não vale gastar 5 minutos compilando (constitution.md Art. 4).
  spec:
    name: Rastreabilidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: trace.py
        # Cobre rastreabilidade (tasks, @Req órfão, ciclos), links entre os
        # documentos, e as guardas dos Arts. 6 e 12.
        #
        # As guardas moraram aqui como `grep` por um tempo, e reprovavam o
        # próprio Money.kt: o KDoc dele explica por que `Double` é proibido, e
        # um grep cru não distingue código de comentário. Agora rodam dentro do
        # trace.py, que remove comentários antes de varrer.
        #
        # Ao fechar a F0, trocar por `--phase F0` — aí passa a cobrar também
        # @Req no código para todo MUST daquela fase. Cada fase concluída
        # avança este argumento.
        run: python tools/trace.py

  build:
    name: Build e testes
    runs-on: ubuntu-latest
    needs: spec
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          # AGP 8.13 não roda sobre JDK 24. Fixado em 21, que é o JBR que o
          # Android Studio também usa.
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: detekt
        run: ./gradlew detekt --no-configuration-cache

      - name: Testes de unidade
        run: ./gradlew test

      - name: assembleDebug
        run: ./gradlew assembleDebug

      - name: Relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            app/build/reports/
            build/reports/detekt/
          retention-days: 7
