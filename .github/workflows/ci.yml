name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate de especificação. Roda primeiro e sem Gradle: se a rastreabilidade
  # quebrou, não vale gastar 5 minutos compilando (constitution.md Art. 4).
  spec:
    name: Rastreabilidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: trace.py
        # Cobre rastreabilidade (tasks, @Req órfão, ciclos), links entre os
        # documentos, e as guardas dos Arts. 6 e 12.
        #
        # As guardas moraram aqui como `grep` por um tempo, e reprovavam o
        # próprio Money.kt: o KDoc dele explica por que `Double` é proibido, e
        # um grep cru não distingue código de comentário. Agora rodam dentro do
        # trace.py, que remove comentários antes de varrer.
        #
        # `--phase F2` cobra, além disso, @Req no código para todo MUST da F0
        # à F2 — as três fases entraram inteiras na v0.1.0, e sem isto um
        # requisito entregue poderia perder o teste sem ninguém notar. Cada fase
        # concluída avança este argumento.
        #
        # Ficou em F0 por uma release inteira porque a F1 reprovava por um erro
        # só, e de escrituração: `REQ-BUD-003` nomeava o `BudgetProgressTest`
        # desde sempre, o teste sempre exerceu as duas faixas de alerta, e a
        # citação nunca foi acrescentada à anotação. Um portão que não avança
        # deixa de ser portão.
        run: python tools/trace.py --phase F2

  build:
    name: Build e testes
    runs-on: ubuntu-latest
    needs: spec
    steps:
      - uses: actions/checkout@v4

      # Confere o hash do gradle-wrapper.jar contra os oficiais antes de o
      # Gradle rodar qualquer coisa. Num repositorio aberto o wrapper e o alvo
      # obvio: e um .jar versionado que ninguem le no diff, e ele executa com
      # os privilegios do CI. Roda aqui, e nao no job de spec, porque so este
      # job chama o ./gradlew.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          # AGP 8.13 não roda sobre JDK 24. Fixado em 21, que é o JBR que o
          # Android Studio também usa.
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: detekt
        run: ./gradlew detekt --no-configuration-cache

      - name: Testes de unidade
        run: ./gradlew test

      - name: assembleDebug
        run: ./gradlew assembleDebug

      - name: Relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            app/build/reports/
            build/reports/detekt/
          retention-days: 7
